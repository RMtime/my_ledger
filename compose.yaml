services:
  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    env_file: .env.production
    environment:
      DATABASE_PATH: /app/data/ledger.db
      MIGRATION_BACKUP_DIR: /app/backups
      NODE_ENV: production
    volumes:
      - ledger-data:/app/data
      - ledger-backups:/app/backups
    security_opt:
      - no-new-privileges:true

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env.production
    environment:
      DATABASE_PATH: /app/data/ledger.db
      NODE_ENV: production
    volumes:
      - ledger-data:/app/data
      - ledger-backups:/app/backups
    # 只发布到回环口：由宿主机上的 nginx 终止 TLS 并反代到这里。
    # 不要绑 0.0.0.0，否则应用会绕过 nginx 直接暴露在公网。
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  ledger-data:
  ledger-backups:
